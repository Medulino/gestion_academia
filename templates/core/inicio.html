{% extends 'base.html' %}

{% block content %}
    <div class="text-center my-5">
        <h1 class="display-4 fw-bold">Plataforma de Gestión de Formación</h1>
        <p class="lead text-muted">Proyecto realizado con Django</p>
        
        {% if user.is_authenticated %}
            <div class="alert alert-success d-inline-block mt-3 px-4">
                Bienvenido, <strong>{{ user.first_name|default:user.username }}</strong>
            </div>
        {% endif %}
    </div>
{% endblock %}
